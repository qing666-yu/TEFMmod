name: Build TEF Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip TEFKernel source
      run: unzip tefkernel.zip
    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '26.1.10909125'
    - name: Build TEFKernel dependencies
      run: |
        cd tefkernel
        cmake -B build -S . \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)
    - name: Compile your Mod
      run: |
        clang --target=aarch64-linux-android21 \
          --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot \
          -I$GITHUB_WORKSPACE/tefkernel/include \
          -L$GITHUB_WORKSPACE/tefkernel/build \
          -shared -fPIC \
          -o libmy_first_mod.so my_first_mod.c \
          -ldobby -lffi -llog \
          -Wl,--unresolved-symbols=ignore-all
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-so
        path: libmy_first_mod.so
