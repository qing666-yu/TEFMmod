name: Build TEF Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip TEFKernel source
      run: unzip tefkernel.zip
      
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        
    - name: Build TEFKernel dependencies
      run: |
        cd tefkernel
        cmake -B build -S . \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)
        
    - name: Find and Compile your Mod
      run: |
        # 自动寻找 libdobby.a 和 libffi.a 所在的目录
        DOBBY_PATH=$(find $GITHUB_WORKSPACE/tefkernel/build -name "libdobby.a" | head -n 1 | xargs dirname)
        FFI_PATH=$(find $GITHUB_WORKSPACE/tefkernel/build -name "libffi.a" | head -n 1 | xargs dirname)
        
        echo "Dobby library found in: $DOBBY_PATH"
        echo "FFI library found in: $FFI_PATH"
        
        # 重新编译，链接路径已修正，去掉了 -lgcc
        clang --target=aarch64-linux-android21 \
          --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot \
          -I$GITHUB_WORKSPACE/tefkernel/include \
          -L$DOBBY_PATH \
          -L$FFI_PATH \
          -L$GITHUB_WORKSPACE/tefkernel/build \
          -shared -fPIC \
          -o libmy_first_mod.so my_first_mod.c \
          -ldobby -lffi -llog \
          -Wl,--unresolved-symbols=ignore-all
          
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-so
        path: libmy_first_mod.so
